services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cvapp-frontend-dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0